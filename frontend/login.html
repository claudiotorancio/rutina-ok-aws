<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RutinaOk - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/admin.css" />
  </head>
  <body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card custom-card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
      <div class="text-center mb-4">
        <i class="bi bi-tools text-accent display-4"></i>
        <h3 class="fw-bold mt-2">RutinaOk</h3>
        <p class="text-muted small">Panel de Administración CMMS</p>
      </div>
      
      <!-- Modal Dinámico de Notificaciones / Respuestas -->
<div class="modal fade" id="modalRespuesta" tabindex="-1" aria-labelledby="modalRespuestaLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content custom-card border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title fw-bold" id="modalRespuestaLabel">
          <i id="modal-icono" class="bi bi-info-circle text-info me-2"></i>
          <span id="modal-titulo">Notificación</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="modal-mensaje" class="m-0 text-muted">Mensaje de respuesta del servidor...</p>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-accent btn-sm px-4" data-bs-dismiss="modal">Aceptar</button>
      </div>
    </div>
  </div>
</div>

      <form id="form-login">
        <div class="mb-3">
          <label class="form-label text-muted">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control bg-dark border-secondary text-white" placeholder="admin@rutinaok.com" required />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control bg-dark border-secondary text-white" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn btn-accent w-100 py-2 fw-bold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
        </button>
      </form>
    </div>
 <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./src/login.js"></script>
  </body>
</html>
