<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RutinaOk - Panel de Control CMMS</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Estilos Personalizados -->
</head>

<body>
  <div class="dashboard-wrapper">

    <!-- ================= SIDEBAR (Fijo en Desktop / Deslizante en Mobile) ================= -->
    <aside class="sidebar offcanvas-lg offcanvas-start bg-dark text-white p-3" tabindex="-1" id="sidebarMobile">

      <!-- Header exclusivo para cuando se abre en modo móvil -->
      <div class="offcanvas-header border-bottom border-secondary px-0 pb-3 mb-3 d-lg-none">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-tools text-accent fs-3"></i>
          <h4 class="m-0 fw-bold">RutinaOk</h4>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
          data-bs-target="#sidebarMobile" aria-label="Close"></button>
      </div>

      <!-- Título visible solo en modo Desktop -->
      <div class="d-flex align-items-center gap-2 mb-4 px-2 d-none d-lg-flex">
        <i class="bi bi-tools text-accent fs-3"></i>
        <h4 class="m-0 fw-bold">RutinaOk</h4>
      </div>

      <nav class="nav nav-pills flex-column mb-auto">
        <a class="nav-link active mb-2" href="#" data-tab="dashboard" id="tab-dashboard">
          <i class="bi bi-speedometer2"></i> Dashboard Principal
        </a>

        <!-- SECCIÓN 1: OPERACIONES Y CAMPO -->
        <small class="text-uppercase text-muted px-3 mt-3 mb-1 font-monospace"
          style="font-size: 0.7rem">Operaciones</small>
        <a class="nav-link mb-1" href="#" data-tab="ordenes" id="tab-ordenes">
          <i class="bi bi-clipboard-check"></i> Órdenes de Trabajo
        </a>
        <a class="nav-link mb-1" href="#" data-tab="tecnicos" id="tab-tecnicos">
          <i class="bi bi-person-badge"></i> Técnicos
        </a>
        <a class="nav-link mb-1" href="#" data-tab="intervenciones" id="tab-intervenciones">
          <span><i class="bi bi-wrench me-2"></i> Intervenciones</span>
          <span class="badge bg-danger rounded-pill d-none" id="badge-intervenciones">0</span>
        </a>

        <!-- SECCIÓN 2: INVENTARIO Y CLIENTES -->
        <small class="text-uppercase text-muted px-3 mt-3 mb-1 font-monospace" style="font-size: 0.7rem">Inventario &
          Clientes</small>
        <a class="nav-link mb-1" href="#" data-tab="clientes" id="tab-clientes">
          <i class="bi bi-building"></i> Clientes
        </a>
        <a class="nav-link mb-1" href="#" data-tab="equipos" id="tab-equipos">
          <i class="bi bi-cpu"></i> Equipos / HVAC
        </a>

        <!-- SECCIÓN 3: CONFIGURACIÓN -->
        <small class="text-uppercase text-muted px-3 mt-3 mb-1 font-monospace" style="font-size: 0.7rem">Sistema</small>
        <a class="nav-link mb-1" href="#" data-tab="configuracion" id="tab-configuracion">
          <i class="bi bi-gear"></i> Configuración
        </a>
      </nav>

      <div class="pt-3 border-top border-secondary-subtle px-2">
        <small class="text-muted d-block">RutinaOk CMMS</small>
        <small class="text-muted" style="font-size: 0.75rem">Panel Administrativo</small>
      </div>
    </aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <div class="flex-grow-1 d-flex flex-column">

      <!-- Top Navbar -->
      <header class="p-3 border-bottom border-secondary-subtle d-flex justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
          <!-- Botón Hamburguesa para pantallas chicas -->
          <button class="btn btn-dark border-secondary d-lg-none text-light" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebarMobile" aria-controls="sidebarMobile">
            <i class="bi bi-list fs-4"></i>
          </button>

          <div class="input-group" style="max-width: 320px;">
            <span class="input-group-text bg-dark border-secondary text-muted">
              <i class="bi bi-search"></i>
            </span>
            <input type="text" class="form-control bg-dark border-secondary text-white"
              placeholder="Buscar órdenes, equipos..." />
          </div>
        </div>

        <!-- Sección de Sesión / Salida -->
        <div class="d-flex align-items-center gap-3">
          <div class="d-none d-sm-block text-end">
            <small class="text-muted d-block">RutinaOk CMMS</small>
            <strong class="text-white small" id="user-email-display">Administrador</strong>
          </div>
          <button id="btn-logout"
            class="btn btn-outline-danger btn-sm d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Salir</span>
          </button>
        </div>
      </header>

      <!-- Modal Dinámico de Notificaciones / Respuestas -->
      <div class="modal fade" id="modalRespuesta" tabindex="-1" aria-labelledby="modalRespuestaLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content custom-card border-secondary">
            <div class="modal-header border-secondary">
              <h5 class="modal-title fw-bold" id="modalRespuestaLabel">
                <i id="modal-icono" class="bi bi-info-circle text-info me-2"></i>
                <span id="modal-titulo">Notificación</span>
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p id="modal-mensaje" class="m-0 text-muted">Mensaje de respuesta del servidor...</p>
            </div>
            <div class="modal-footer border-secondary" id="modal-footer-botones">
              <button type="button" class="btn btn-accent btn-sm px-4" data-bs-dismiss="modal">Aceptar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Dashboard Body Dinámico (Contenedor maestro limpio) -->
      <main class="p-4 flex-grow-1">
        <div class="row g-4" id="main-container-content">
          <!-- Todo el contenido se renderiza dinámicamente desde JavaScript -->
        </div>
      </main>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script principal con Vite type="module" -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
